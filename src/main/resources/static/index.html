<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayRecon</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:white;padding:24px 8%}main{max-width:1000px;margin:30px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 10px #0001}.num{font-size:28px;font-weight:bold}table{width:100%;margin-top:25px;background:white;border-radius:12px;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #eee;text-align:left}.muted{color:#667085}</style></head><body><header><h1>PayRecon</h1><div>Payment reconciliation dashboard</div></header><main><p class="muted">A demonstration fintech system for transaction and settlement matching.</p><div class="grid" id="summary"></div><table><thead><tr><th>Reference</th><th>Merchant</th><th>Amount</th><th>Channel</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></main><script>async function load(){let s=await fetch('/api/summary').then(r=>r.json());document.getElementById('summary').innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><div class="muted">${k.replaceAll('_',' ')}</div><div class="num">${v}</div></div>`).join('');let p=await fetch('/api/payments').then(r=>r.json());document.getElementById('rows').innerHTML=p.map(x=>`<tr><td>${x.reference}</td><td>${x.merchant}</td><td>${x.currency} ${x.amount}</td><td>${x.channel}</td><td>${x.status}</td></tr>`).join('')}load();setInterval(load,5000)</script></body></html>
